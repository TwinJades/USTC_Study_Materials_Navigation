<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <meta name="description" content="中科大本科课程资料导航，按课号或课名查找历年试题、作业小测、笔记讲义、参考书与课程项目，直达原站入口。">
    <title>也西书架 · 中科大本科课程资料导航</title>
    <link rel="icon" type="image/png" href="assets/logo.png">
    <script>try{var t=localStorage.getItem('ustc-course-nav.theme');document.documentElement.dataset.theme=t==='dark'||t==='system'?t:'light';}catch{document.documentElement.dataset.theme='light';}</script>
    <link rel="stylesheet" href="assets/style.css">
    <script type="module" src="assets/mode.mjs"></script>
    <script type="module" src="assets/announcements.mjs"></script>
    <script type="module" src="assets/app.mjs"></script>
  </head>
  <body data-page="index">
    <a class="skip-link" href="#main">跳到主要内容</a>

    <header class="site-header">
      <div class="wrap header-inner">
        <p class="brand">
          <a href="./">
            <img class="brand-logo" src="assets/logo.png" alt="" width="28" height="28">
            <span class="brand-text">也西书架</span>
          </a>
        </p>
        <nav class="site-nav" aria-label="主导航">
          <div class="nav-icon-group">
            <button type="button" class="icon-circle-btn announcement-toggle" aria-label="公告栏" title="公告栏" aria-haspopup="dialog" aria-expanded="false" aria-controls="announcements" hidden>
              <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M6.5 2.75V6.25M13.5 2.75V6.25"></path>
                <rect x="2.75" y="6.25" width="14.5" height="10.75" rx="2"></rect>
                <path d="M6 10.25h8M6 13.5h5.25"></path>
              </svg>
            </button>
            <button type="button" class="icon-circle-btn mode-icon-btn" data-mode-toggle aria-pressed="false" aria-label="切换简洁或详细模式" hidden>
              <svg class="icon-mode-compact" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="4" y="2.5" width="12" height="15" rx="2"></rect>
                <path d="M7.5 7.5h5M7.5 11.5h3.5"></path>
              </svg>
              <svg class="icon-mode-detailed" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="4" y="2.5" width="12" height="15" rx="2"></rect>
                <path d="M7 6.5h6M7 9.5h6M7 12.5h6M7 15h4"></path>
              </svg>
            </button>
            <button type="button" class="icon-circle-btn theme-icon-btn" data-theme-toggle aria-label="切换外观主题" hidden>
              <svg class="icon-theme-light" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="10" cy="10" r="3.5"></circle>
                <path d="M10 2.5v1.5M10 16v1.5M2.5 10H4M16 10h1.5M4.7 4.7l1.05 1.05M14.25 14.25l1.05 1.05M15.3 4.7l-1.05 1.05M5.75 14.25l-1.05 1.05"></path>
              </svg>
              <svg class="icon-theme-dark" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M16.2 12.6A6.8 6.8 0 0 1 7.4 3.8a7 7 0 1 0 8.8 8.8Z"></path>
              </svg>
              <svg class="icon-theme-system" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="2.75" y="3.5" width="14.5" height="9.75" rx="1.6"></rect>
                <path d="M7.5 16.5h5M10 13.25v3.25"></path>
              </svg>
            </button>
          </div>
          <a href="./" aria-current="page">课程目录</a>
          <a href="sources.html">来源与致谢</a>
        </nav>
      </div>
    </header>

    <main id="main" class="wrap" tabindex="-1">
      <header class="page-hero">
        <div class="hero-main">
          <img class="hero-logo" src="assets/logo.png" alt="" width="72" height="72">
          <h1>也西书架</h1>
          <p class="intro mode-detail">
            涵盖 2025 秋—2026 秋本科开课，按课程代码整理。
          </p>
        </div>
        <p class="hero-star">如果这个项目对你有帮助，欢迎到<a href="https://github.com/TwinJades/USTC_Study_Materials_Navigation">我的仓库</a>点一颗 Star 支持，谢谢！</p>
      </header>

      <search>
        <form id="filters" class="filters" method="get" action="./" aria-labelledby="filters-heading">
          <h2 id="filters-heading" class="visually-hidden">搜索与筛选</h2>

          <div class="query-row">
            <div class="query-field">
              <label for="q" class="query-label">课程代码或名称</label>
              <div class="search-input-wrap">
                <svg class="search-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                  <circle cx="8.5" cy="8.5" r="5.75"></circle>
                  <path d="M13 13l4 4" stroke-linecap="round"></path>
                </svg>
                <input
                  id="q"
                  name="q"
                  type="search"
                  autocomplete="off"
                  autocapitalize="none"
                  autocorrect="off"
                  spellcheck="false"
                  enterkeyhint="search"
                  placeholder="例如 MATH1001、001548 或数学分析"
                >
                <button type="button" id="clear-search" class="search-clear" aria-label="清除搜索与筛选" title="清除搜索与筛选">
                  <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" aria-hidden="true">
                    <path d="M3.5 3.5l13 13M16.5 3.5l-13 13"></path>
                  </svg>
                </button>
              </div>
            </div>
            <div class="query-actions">
              <button type="submit" class="primary">搜索</button>
            </div>
          </div>

          <div class="filter-groups mode-detail">
            <fieldset class="filter-group kind-group">
              <legend>类别</legend>
              <div class="option-row segmented-options">
                <label class="option"><input type="radio" name="kind" value="all" checked><span>全部</span></label>
                <label class="option"><input type="radio" name="kind" value="common"><span>通修</span></label>
                <label class="option"><input type="radio" name="kind" value="general"><span>通识</span></label>
                <label class="option"><input type="radio" name="kind" value="professional"><span>专业</span></label>
              </div>
            </fieldset>

            <div class="filter-group select-group">
              <label for="type">资料类型</label>
              <select id="type" name="type">
                <option value="all">全部类型</option>
              </select>
            </div>

            <div class="filter-group select-group" id="year-group" hidden>
              <label for="year">试题年份</label>
              <select id="year" name="year">
                <option value="all">全部年份</option>
              </select>
            </div>

            <fieldset class="filter-group status-group">
              <legend>资料情况</legend>
              <div class="option-row check-pills">
                <label class="option"><input type="checkbox" name="status" value="with" checked><span>已收录</span></label>
                <label class="option"><input type="checkbox" name="status" value="without" checked><span>暂未收录</span></label>
              </div>
            </fieldset>

            <div class="filter-group tag-toggle-group" id="tag-toggle-group" hidden>
              <span class="filter-label" id="tag-group-label">学科</span>
              <button type="button" id="tag-toggle" class="tag-drawer-toggle" aria-expanded="false" aria-controls="tag-drawer">
                <span>选择学科</span>
                <span id="tag-count" class="tag-count" hidden></span>
                <svg class="tag-chevron" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M4 6l4 4 4-4"></path>
                </svg>
              </button>
            </div>
          </div>

          <div id="tag-drawer" class="tag-drawer mode-detail" data-open="false" hidden>
            <div class="tag-drawer-inner">
              <div class="tags-body">
                <p class="field-hint">本站整理的学科标签，支持多选（命中任一学科即显示）。</p>
                <div id="tag-options" class="tag-options" role="group" aria-labelledby="tag-group-label"></div>
              </div>
            </div>
          </div>
        </form>
      </search>

      <div id="hero-pulse" class="hero-pulse" hidden>
        <span id="hero-pulse-text" class="hero-pulse-text"></span>
        <button type="button" id="hero-browse-all" class="hero-browse-btn">浏览全部 →</button>
      </div>

      <section class="results" aria-labelledby="results-heading">
        <div class="results-head">
          <div class="results-head-info">
            <h2 id="results-heading" tabindex="-1">课程列表</h2>
            <p id="result-status" class="result-status" role="status">正在加载课程…</p>
          </div>
        </div>

        <p id="load-error" class="load-error" role="alert" hidden></p>

        <noscript>
          <p class="load-error">请启用 JavaScript 以使用搜索与课程目录。</p>
        </noscript>

        <ul id="course-list" class="course-list" role="list"></ul>

        <nav id="pagination" class="pagination" aria-label="课程结果翻页" hidden>
          <button type="button" id="prev-page" class="secondary" aria-controls="course-list">← 上一页</button>
          <p id="page-status" class="page-status" role="status"></p>
          <button type="button" id="next-page" class="secondary" aria-controls="course-list">下一页 →</button>
        </nav>

        <div id="no-results" class="empty-state" hidden>
          <p id="no-results-text"></p>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="wrap footer-inner">
        <div class="footer-notes">
          <p>资料均直达原站，版权归原作者所有。</p>
          <p><a href="sources.html">来源与致谢</a></p>
        </div>
        <dl id="site-stats" class="site-stats" aria-label="访问统计" hidden>
          <div class="stat-pill" data-stat-item="repo_views_yesterday" hidden>
            <dt>仓库昨日浏览（UTC）<span data-stat-date></span></dt>
            <dd data-stat-value="repo_views_yesterday"></dd>
          </div>
          <div class="stat-pill" data-stat-item="repo_views_14d" hidden>
            <dt>仓库浏览（近 14 天）</dt>
            <dd data-stat-value="repo_views_14d"></dd>
          </div>
          <div class="stat-pill" data-stat-item="site_views_yesterday" hidden>
            <dt>网站昨日浏览（UTC）<span data-stat-date></span></dt>
            <dd data-stat-value="site_views_yesterday"></dd>
          </div>
          <div class="stat-pill" data-stat-item="site_total_views" hidden>
            <dt>网站累计浏览</dt>
            <dd data-stat-value="site_total_views"></dd>
          </div>
          <div class="stat-pill" data-stat-item="collected_at" hidden>
            <dt>统计更新（北京时间）</dt>
            <dd><time data-stat-value="collected_at"></time></dd>
          </div>
        </dl>
      </div>
    </footer>
  </body>
</html>
