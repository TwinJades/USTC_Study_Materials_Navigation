name: Deploy course navigation site

on:
  push:
    branches-ignore:
      - monitoring-data
  workflow_dispatch:
  schedule:
    - cron: '23 */4 * * *'

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build static site
    if: >-
      github.repository == 'TwinJades/USTC_Study_Materials_Navigation' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Load published link monitoring
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run monitor -- --load-published

      - name: Validate data strictly for publishing
        run: npm run validate -- --strict-research --require-monitoring

      - name: Collect visit counts
        env:
          TRAFFIC_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          GOATCOUNTER_SITE: ${{ vars.GOATCOUNTER_SITE }}
        run: node scripts/collect-traffic.mjs

      - name: Validate data and build dist
        env:
          GOATCOUNTER_SITE: ${{ vars.GOATCOUNTER_SITE }}
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
