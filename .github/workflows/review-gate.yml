name: Recalculate review gate

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review, labeled, unlabeled, edited]
  workflow_run:
    workflows: [Review gate events]
    types: [completed]
  workflow_dispatch:
    inputs:
      pull_request:
        description: Pull request number to refresh
        required: true
        type: number

permissions:
  contents: read
  pull-requests: read

jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      numbers: ${{ steps.resolve.outputs.numbers }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/main
          persist-credentials: false
      - id: resolve
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/review-gate.mjs resolve

  publish:
    needs: resolve
    if: needs.resolve.outputs.numbers != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    strategy:
      fail-fast: false
      matrix:
        number: ${{ fromJSON(needs.resolve.outputs.numbers) }}
    concurrency:
      group: review-gate-pr-${{ matrix.number }}
      cancel-in-progress: false
    steps:
      # Never check out the proposing branch or consume its artifacts or caches.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/main
          persist-credentials: false
      - env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ matrix.number }}
        run: node scripts/review-gate.mjs publish
