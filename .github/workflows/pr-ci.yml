name: Pull request CI

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, edited]

permissions:
  contents: read

concurrency:
  group: pr-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checks:
    name: PR checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the proposed merge
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Validate course data
        run: npm run validate -- --strict-research

      - name: Run tests with Chrome
        shell: bash
        run: |
          chrome_path=$(command -v google-chrome)
          "$chrome_path" --version
          CHROME_PATH="$chrome_path" npm test | tee "$RUNNER_TEMP/node-tests.log"
          grep -Fxq 'ℹ skipped 0' "$RUNNER_TEMP/node-tests.log"

      - name: Build static site
        run: npm run build
