name: Archive repository traffic

# 每日将 GitHub /traffic/views 中已结束的 UTC 日访问计数（date、count、uniques）
# 归档至独立孤儿分支 `traffic-history` 的 `traffic-history.json`（仅快进推送）。

on:
  schedule:
    # 每日 UTC 04:43（北京时间 12:43），避开 UTC 零点结算延迟；脚本会自动跳过未结束当天。
    - cron: '43 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # 串行执行，避免并发写入冲突。
  group: traffic-archive
  cancel-in-progress: false

jobs:
  archive:
    name: Archive completed UTC days
    # 仅允许默认分支运行，避免未审分支写入归档。
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # 推送 traffic-history 分支所需最小权限。
      contents: write
    steps:
      - name: Checkout workflow code
        uses: actions/checkout@v4
        with:
          # 保留 checkout 凭据供脚本拉取与快进推送（避免在命令行传递 token）。
          persist-credentials: true
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Merge completed days into traffic-history
        # 优先使用 TRAFFIC_TOKEN，未配置时回退至 GITHUB_TOKEN；均无权限时直接失败退出。
        env:
          TRAFFIC_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/archive-traffic.mjs --publish
