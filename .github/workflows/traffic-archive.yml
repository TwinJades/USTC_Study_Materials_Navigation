name: Archive repository traffic

# GitHub 仅保留近 14 天的 /traffic/views 数据，本工作流每日将已结束 UTC 日的计数
# 归档至独立孤儿分支 `traffic-history` 下的 `traffic-history.json`。
# 归档仅含日期、浏览量（count）与独立访客数（uniques），不触碰默认分支、不强制推送、
# 也不触发 Pages 部署。定时与手动触发均限定在默认分支运行，避免未审核代码写入归档。

on:
  schedule:
    # 每日 UTC 04:43（北京时间 12:43），避开 UTC 零点结算延迟；脚本会自动跳过未结束当天。
    - cron: '43 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # 串行执行，避免并发写入冲突。
  group: traffic-archive
  cancel-in-progress: false

jobs:
  archive:
    name: Archive completed UTC days
    # 定时与手动触发均仅在默认分支运行，防止未审代码写归档分支。
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # 仅需推送 traffic-history 分支，不授予 issues、pages、id-token 等额外权限。
      contents: write
    steps:
      - name: Checkout workflow code
        uses: actions/checkout@v4
        with:
          # 保留 checkout 写入 .git/config 的凭据，供脚本静默拉取并快进推送，token 不出现在日志中。
          persist-credentials: true
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Merge completed days into traffic-history
        # 优先使用 TRAFFIC_TOKEN，未配置时回退至 GITHUB_TOKEN；均无权限时直接失败，不补写 0。
        env:
          TRAFFIC_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/archive-traffic.mjs --publish
