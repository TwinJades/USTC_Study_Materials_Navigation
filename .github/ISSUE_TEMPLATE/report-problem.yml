name: 报告问题
description: 反馈网站故障、外链失效或课程资料信息有误。
title: '[问题] '
body:
  - type: textarea
    id: problem
    attributes:
      label: 实际情况与预期结果
      description: 简述遇到的问题及预期表现。
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 定位与复现方式
      description: 网站故障请附页面地址与操作步骤；资料问题请填写课号、资料名称或课程详情链接。
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 补充信息（可选）
      description: 可附浏览器与设备型号、脱敏截图或可佐证更正的原始来源链接。请勿公开个人信息、登录凭据或资料原件。
