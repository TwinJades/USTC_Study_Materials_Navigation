name: 推荐资料来源
description: 推荐中科大本科课程可公开访问的资料页、目录或资料库。
title: '[资料来源] '
labels: [source]
body:
  - type: input
    id: source-url
    attributes:
      label: 原始来源链接
      description: 请填公开、稳定的链接，不要上传资料或粘贴带临时签名的链接。
      placeholder: https://...
    validations:
      required: true
  - type: input
    id: courses
    attributes:
      label: 可能对应的课程
      description: 有课号请写课号；综合目录或暂不确定可以留空。
  - type: textarea
    id: contents
    attributes:
      label: 里面有什么资料？
      description: 请说明资料类型，能确认年份、卷别、作者或许可时也请写上。
    validations:
      required: true
  - type: input
    id: attribution
    attributes:
      label: 希望如何致谢（可选）
      description: 如愿意在收录后公开致谢，可填 GitHub 用户名或昵称。留空不公开署名。
