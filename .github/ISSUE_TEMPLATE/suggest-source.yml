name: 推荐资料来源
description: 推荐中科大本科课程可公开访问的资料页、目录或仓库。
title: '[资料来源] '
labels: [source]
body:
  - type: input
    id: source-url
    attributes:
      label: 原始来源链接
      description: 请填写公开、稳定的链接；勿上传资料原件或粘贴带临时签名的地址。
      placeholder: https://...
    validations:
      required: true
  - type: input
    id: courses
    attributes:
      label: 对应课程（可选）
      description: 已知课号请填官方课号；综合目录或暂不确定可留空。
  - type: textarea
    id: contents
    attributes:
      label: 资料内容概述
      description: 说明包含的资料类型；如能确认年份、卷别、作者或许可信息请一并写明。
    validations:
      required: true
  - type: input
    id: attribution
    attributes:
      label: 致谢署名（可选）
      description: 若希望收录后公开致谢，可填写 GitHub 用户名或昵称；留空则不公开署名。
