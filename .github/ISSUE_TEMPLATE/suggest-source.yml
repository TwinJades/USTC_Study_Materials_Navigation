name: 推荐资料来源
description: 推荐公开的中科大本科课程资料页、目录或仓库。
title: '[资料来源] '
labels: [source]
body:
  - type: input
    id: source-url
    attributes:
      label: 原始来源链接
      description: 请填写公开可访问的原站链接（无需上传文件原件，也不要粘贴临时签名链接）。
      placeholder: https://...
    validations:
      required: true
  - type: input
    id: courses
    attributes:
      label: 对应课程（可选）
      description: 可填课名或官方课号；如果是综合资料站或暂不确定，留空即可。
  - type: textarea
    id: contents
    attributes:
      label: 资料内容
      description: 大致说明包含哪些资料（如试题、讲义、作业等）；如果知道年份、卷别或作者，欢迎一并写上。
    validations:
      required: true
  - type: input
    id: attribution
    attributes:
      label: 致谢署名（可选）
      description: 希望在收录后公开致谢时，可留下 GitHub 用户名或昵称。
