name: 推荐衍生项目
description: 分享基于也西书架数据开发的公开项目、工具或题库。
title: '[衍生项目] '
body:
  - type: input
    id: project-name
    attributes:
      label: 项目名称
      placeholder: 例如 USTC Question Bank
    validations:
      required: true
  - type: input
    id: project-url
    attributes:
      label: 项目链接
      description: 请填写公开、稳定的仓库或项目主页链接。
      placeholder: https://...
    validations:
      required: true
  - type: input
    id: author
    attributes:
      label: 作者或维护者
      description: 希望在公告栏「衍生项目」中展示的作者名或 GitHub 用户名。
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: 项目简介
      description: 简述项目做什么、怎么用，以及用到了也西书架的哪些数据。
    validations:
      required: true
  - type: input
    id: notice-url
    attributes:
      label: 出处或致谢说明链接（可选）
      description: 如果项目有单独的 NOTICE、致谢或说明页，可以填在这里。
      placeholder: https://...
