name: 提出改进建议
description: 建议新的站点功能或改进现有的查找和浏览体验。
title: '[建议] '
body:
  - type: textarea
    id: use-case
    attributes:
      label: 使用场景与需求
      description: 你想完成什么任务？目前在哪一步遇到了困难？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 改进设想（可选）
      description: 如果有具体想法，请描述希望看到的行为或效果。
