name: 提出改进建议
description: 建议新功能或改进现有的检索与浏览体验。
title: '[建议] '
body:
  - type: textarea
    id: use-case
    attributes:
      label: 使用场景与需求
      description: 说说你在找资料时想做什么，目前哪里用着不顺手。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 改进设想（可选）
      description: 如果已经有具体想法，欢迎写下期望的效果或交互方式。
